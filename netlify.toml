[build]
  command = "curl -L https://github.com/quarto-dev/quarto-cli/releases/download/v1.6.40/quarto-1.6.40-linux-amd64.tar.gz -o /tmp/quarto.tar.gz && tar -xzf /tmp/quarto.tar.gz -C /tmp && /tmp/quarto-1.6.40/bin/quarto render"
  publish = "_site"

[build.environment]
  QUARTO_VERSION = "1.6.40"

[context.production.environment]
  QUARTO_ENV = "production"

[context.deploy-preview]
  command = "curl -L https://github.com/quarto-dev/quarto-cli/releases/download/v1.6.40/quarto-1.6.40-linux-amd64.tar.gz -o /tmp/quarto.tar.gz && tar -xzf /tmp/quarto.tar.gz -C /tmp && /tmp/quarto-1.6.40/bin/quarto render"

[[headers]]
  for = "/*.xml"
  [headers.values]
    Content-Type = "application/rss+xml; charset=UTF-8"

[[headers]]
  for = "/*.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=UTF-8"
